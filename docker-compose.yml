version: "3.8"
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=video_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9870:9870"  # Web UI
      - "8020:8020"  # Internal HDFS communication
      - "9000:9000"  # External client access
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CLUSTER_NAME=video_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode

  spark:
    build: ./docker/spark
    container_name: spark
    environment:
      - SPARK_MODE=master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080" # Master Web UI
      - "7077:7077" # Master Port
      - "4040:4040" # Spark Application UI
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./data:/opt/data
    depends_on:
      - namenode

  spark-worker:
    # FIX: Build from the same Dockerfile so the worker has numpy/ffmpeg too!
    build: ./docker/spark
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    # Explicitly point to the master container
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    volumes:
      - ./spark_jobs:/opt/spark_jobs
      - ./data:/opt/data
    depends_on:
      - spark

volumes:
  namenode_data:
  datanode_data: